
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body{
            background:#f5f7fa;
        }

        .card{
            border:none;
            border-radius:18px;
            overflow:hidden;
        }

        .card-header{
            padding:20px;
        }

        .form-control,
        .form-select{
            height:50px;
            border-radius:12px;
        }

        textarea.form-control{
            height:120px;
            resize:none;
        }

        .btn{
            border-radius:12px;
            height:50px;
            font-weight:600;
        }

        .input-group-text{
            border-radius:12px 0 0 12px;
        }

        .page-title{
            font-weight:700;
            color:#2c3e50;
        }
    </style>

</head>
<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white">

                    <h3 class="mb-0">
                        <i class="bi bi-box-seam-fill me-2"></i>
                        Add New Product
                    </h3>

                </div>

                <div class="card-body p-4">

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form action="{% url 'product' %}" method="POST">

                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Category
                                </label>

                                <select name="category"
                                        class="form-select"
                                        required>

                                    <option value="">Select Category</option>

                                    {% for item in category %}
                                        <option value="{{ item.id }}">
                                            {{ item.name }}
                                        </option>
                                    {% endfor %}

                                </select>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Supplier
                                </label>

                                <select name="supplier"
                                        class="form-select"
                                        required>

                                    <option value="">Select Supplier</option>

                                    {% for item in supplier %}
                                        <option value="{{ item.id }}">
                                            {{ item.name }}
                                        </option>
                                    {% endfor %}

                                </select>

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Product Name
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-box"></i>
                                </span>

                                <input type="text"
                                       name="name"
                                       class="form-control"
                                       placeholder="Enter product name"
                                       required>

                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                SKU
                            </label>

                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-upc-scan"></i>
                                </span>

                                <input type="text"
                                       name="sku"
                                       class="form-control"
                                       placeholder="Product SKU"
                                       required>

                            </div>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Cost Price
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">{{ currency_symbol }}</span>

                                    <input type="number"
                                           step="0.01"
                                           name="cost_price"
                                           class="form-control"
                                           required>

                                </div>

                            </div>


                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Selling Price
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">{{ currency_symbol }}</span>

                                    <input type="number"
                                           step="0.01"
                                           name="selling_price"
                                           class="form-control"
                                           required>

                                </div>

                            </div>

                        </div>


                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label fw-semibold">
                                    Quantity
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-123"></i>
                                    </span>

                                    <input type="number"
                                           name="quantity"
                                           class="form-control"
                                           min="0"
                                           required>

                                </div>

                            </div>

                        </div>


                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea name="description"
                                      class="form-control"
                                      placeholder="Write a short description (optional)"></textarea>

                        </div>


                        <div class="d-flex justify-content-between">

                            <a href="{% url 'dashboard' %}"
                               class="btn btn-outline-secondary px-4">

                                <i class="bi bi-arrow-left"></i>
                                Back

                            </a>

                            <button class="btn btn-primary px-5">

                                <i class="bi bi-check-circle-fill me-2"></i>

                                Save Product

                            </button>

                        </div>

                    </form>
                     <hr>

                    <div class="text-center">
                        <a href="{% url 'all_product' %}" class="btn btn-outline-primary">
                            View All Products
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
