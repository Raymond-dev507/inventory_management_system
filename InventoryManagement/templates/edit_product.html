<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Product</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <style>
      body {
        background: #f5f7fa;
      }

      .card {
        border: none;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      .card-header {
        background: #0d6efd;
        color: #fff;
        border-radius: 15px 15px 0 0 !important;
        padding: 18px;
      }

      .form-control,
      .form-select {
        border-radius: 10px;
        padding: 12px;
      }

      textarea {
        resize: none;
      }

      .btn {
        border-radius: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header">
              <h3 class="mb-0">
                <i class="bi bi-pencil-square"></i>

                Update Product
              </h3>
            </div>

            <div class="card-body p-4">
              <form action="{% url 'update_product' edit.id %}" method="POST">
                {% csrf_token %}

                <div class="mb-3">
                  <label class="form-label fw-bold"> PRODUCT NAME </label>

                  <input
                    type="text"
                    name="name"
                    class="form-control"
                    value="{{ edit.name }}"
                    required
                  />
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold"> CATEGORY </label>

                    <select name="category" class="form-select">
                      {% for item in category %}

                      <option
                        value="{{ item.id }}"
                        {% if item.id == edit.category.id %}
                        selected
                       {% endif%}

                      >
                        {{ item.name }}
                      </option>

                      {% endfor %}
                    </select>
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold"> SUPPLIER </label>

                    <select name="supplier" class="form-select">
                      {% for item in supplier %}

                      <option
                         value="{{ item.id }}"
                         {% if item.id == edit.supplier.id %}selected{% endif %}
                             >
                              {{ item.name }}
                      </option>

                      {% endfor %}
                    </select>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold"> SKU </label>

                  <input
                    type="text"
                    name="sku"
                    class="form-control"
                    value="{{ edit.sku }}"
                    required
                  />
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold"> COST PRICE </label>

                    <input
                      type="number"
                      step="0.01"
                      name="cost_price"
                      class="form-control"
                      value="{{ edit.cost_price }}"
                      required
                    />
                  </div>

                  <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold"> SELLING PRICE </label>

                    <input
                      type="number"
                      step="0.01"
                      name="selling_price"
                      class="form-control"
                      value="{{ edit.selling_price }}"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold"> DESCRIPTION </label>

                  <textarea name="description" rows="4" class="form-control">
{{ edit.description }}</textarea
                  >
                </div>

                <div class="mb-4">
                  <label class="form-label fw-bold"> QUANTITY </label>

                  <input
                    type="number"
                    name="quantity"
                    class="form-control"
                    value="{{ edit.quantity }}"
                    required
                  />
                </div>

                <div class="d-flex justify-content-between">
                  <a href="{% url 'all_product' %}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>

                    Back
                  </a>

                  <button type="submit" class="btn btn-primary">
                    <i class="bi bi-pencil-square"></i>

                    Update Product
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
