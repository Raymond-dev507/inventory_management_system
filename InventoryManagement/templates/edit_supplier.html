<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Supplier</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body{
            background:#f5f7fa;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.08);
        }

        .card-header{
            background:#0d6efd;
            color:white;
            border-radius:15px 15px 0 0 !important;
            padding:18px;
        }

        .form-control{
            border-radius:10px;
            padding:12px;
        }

        textarea{
            resize:none;
        }

        .btn{
            border-radius:10px;
        }
    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card">

                <div class="card-header">

                    <h3 class="mb-0">
                        <i class="bi bi-pencil-square"></i>
                        Update Supplier
                    </h3>

                </div>

                <div class="card-body p-4">

                    <form action="{% url 'update_supplier' edit.id %}" method="POST">

                        {% csrf_token %}

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                               SUPPLIER NAME
                             </label>
                            <input
                             type="text"
                             name="name"
                             class="form-control"
                             value="{{ edit.name }}"
                              required>

                        </div>


<div class="mb-4">

    <label class="form-label fw-bold">
        SUPPLIER PHONE NUMBER
    </label>

    <input
        type="text"
        name="phone"
        class="form-control"
        value="{{ edit.phone }}"
        required>

</div>


<div class="mb-4">

    <label class="form-label fw-bold">
        SUPPLIER EMAIL
    </label>

    <input
        type="email"
        name="email"
        class="form-control"
        value="{{ edit.email }}"
        required>

</div>


<div class="mb-4">

    <label class="form-label fw-bold">
        SUPPLIER ADDRESS
    </label>

    <textarea
        name="address"
        rows="4"
        class="form-control"
        required>{{ edit.address }}</textarea>

</div>
                        <div class="d-flex justify-content-between">

                            <a href="{% url 'all_supplier' %}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>
                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary">

                                <i class="bi bi-pencil-square"></i>
                                 Update Supplier

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
