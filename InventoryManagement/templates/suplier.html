<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supplier Registration</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        body{
            background:#f5f7fa;
        }

        .card{
            border:none;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .card-header{
            background:#ffc107;
            color:#fff;
            border-radius:18px 18px 0 0 !important;
            padding:20px;
        }

        .form-control,
        textarea{
            border-radius:10px;
            padding:12px;
        }

        .form-control:focus,
        textarea:focus{
            box-shadow:none;
            border-color:#198754;
        }

        textarea{
            resize:none;
        }

        .btn{
            border-radius:10px;
            padding:10px 20px;
        }

        .page-title{
            font-weight:700;
        }

        label{
            font-weight:600;
            margin-bottom:6px;
        }
    </style>

</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card">

                <div class="card-header text-center">

                    <h2 class="page-title">
                        <i class="bi bi-truck"></i>
                        Supplier Registration
                    </h2>

                    <p class="mb-0">
                        Register a new supplier for your inventory system.
                    </p>

                </div>

                <div class="card-body p-4">

                    <form action="{% url 'supplier' %}" method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label>
                                Supplier Name
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                placeholder="Enter supplier name"
                                required>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label>
                                    Phone Number
                                </label>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    placeholder="Enter phone number"
                                    required>

                            </div>

                            <div class="col-md-6 mb-3">

                                <label>
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    placeholder="Enter email address"
                                    required>

                            </div>

                        </div>

                        <div class="mb-4">

                            <label>
                                Address
                            </label>

                            <textarea
                                name="address"
                                rows="4"
                                class="form-control"
                                placeholder="Enter supplier address"
                                required></textarea>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="{% url 'dashboard' %}"
                               class="btn btn-secondary">

                                <i class="bi bi-arrow-left"></i>
                                Back

                            </a>

                            <button
                                type="submit"
                                class="btn btn-warning">

                                <i class="bi bi-check-circle-fill"></i>
                                Save Supplier

                            </button>

                        </div>

                    </form>
                <hr>

                    <div class="text-center">
                        <a href="{% url 'all_supplier' %}" class="btn btn-outline-primary">
                            View All SUPPLIER
                        </a>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
